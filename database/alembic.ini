# Alembic configuration — KRISHIMA (authoritative application schema owner).
# Run from the repository root or from database/ using the wrapper script:
#   database/scripts/migrate.sh  (loads database/.env, sets PYTHONPATH=backend)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Migration URL is injected at runtime from MIGRATION_DATABASE_URL (env.py).
sqlalchemy.url =
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
