<!doctype html>
<html lang="en-IN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Theme is applied BEFORE first paint to prevent a flash of the wrong theme.
      This inline script mirrors packages/ui/src/theme/theme.ts → NO_FLASH_SCRIPT.
      Keep them in sync. It is intentionally tiny and has no dependencies.
    -->
    <script>
      (function () {
        try {
          var k = "krishima.theme";
          var p = localStorage.getItem(k);
          if (p !== "light" && p !== "dark" && p !== "system") p = "light";
          var d = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = d ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", r);
          document.documentElement.style.colorScheme = r;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- Fonts: preconnect + display=swap avoids invisible text and layout shift. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>KRISHIMA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
