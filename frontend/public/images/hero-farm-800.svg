<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Abstract illustration of a morning field with a rising sun and rows of crops">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4E6"/>
      <stop offset="1" stop-color="#F7FAF5"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D5A13A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#D5A13A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="0.55" stop-color="#86EFAC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#15803D" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Furrows intentionally run edge to edge; the clip keeps them on canvas. -->
    <clipPath id="frame">
      <rect width="800" height="450"/>
    </clipPath>
  </defs>

